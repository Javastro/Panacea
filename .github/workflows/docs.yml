name: Build and Deploy Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. However, do NOT cancel in-progress runs
# as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
env:
  THISDIR: ${{ github.workspace }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup dependencies
        run: |
          sudo apt update
          sudo apt install -y curl graphviz
      
      

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: make sure bin directory exists
        run: mkdir -p "$THISDIR/bin"

      - name: get latest plantuml
        run: |
          echo "$THISDIR/bin" >> "$GITHUB_PATH"
          curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2026.1/plantuml-1.2026.1.jar
          printf "#!/bin/bash\n$JAVA_HOME/bin/java -jar $THISDIR/bin/plantuml.jar \$@\n" >plantuml
          chmod +x plantuml
        working-directory: ./bin


      - name: Install Sphinx and documentation dependencies
        run: pip install -r doc/requirements.txt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build documentation (Javadoc + Sphinx)
        uses: coactions/setup-xvfb@v1
        with:
          run: ./gradlew docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      #run with the headless environment explicitly because of plantuml diagrams
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
