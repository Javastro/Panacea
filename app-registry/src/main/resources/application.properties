quarkus.application.name=app-registry
quarkus.http.port=8081


quarkus.index-dependency.executiondm.group-id=net.ivoa.dm
quarkus.index-dependency.executiondm.artifact-id=ExecutionDM

# Database
quarkus.datasource.db-kind=postgresql

# Hibernate ORM
%dev.quarkus.hibernate-orm.schema-management.strategy=create
%test.quarkus.hibernate-orm.schema-management.strategy=create
%prod.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Create database schemas referenced by @Table(schema = ...)
quarkus.hibernate-orm.database.generation.create-schemas=true


quarkus.hibernate-orm.schema-management.create-schemas=true
quarkus.hibernate-orm.quote-identifiers.strategy=all
jakarta.persistence.create-database-schemas=true